<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXX</title>
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/128/16172/16172572.png">

    <style>
        :root {
            --c1: #1D0515;
            --c2: #350616;
            --c3: #550816;
            --c4: #800714;
        }

        ::selection {
            background: #5f050e;
            color: white;
        }

        ::-webkit-selection {
            background: #800714;
            color: white;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: var(--c1);
            color: #fff;
            padding-top: 70px;
            /* header yüksekliğine göre ayarla */
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: var(--c2);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            box-sizing: border-box;
        }

        .logo {
            color: var(--c4);
            font-weight: bold;
        }

        nav a {
            margin: 0 10px;
            color: #ccc;
            text-decoration: none;
        }

        nav a:hover {
            color: var(--c4);
        }

        input {
            padding: 6px;
            border: none;
            border-radius: 5px;
            background: var(--c3);
            color: #fff;
        }

        .banner {
            height: 300px;
            overflow: hidden;
            margin-top: -13px;
        }

        .banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .section {
            padding: 20px;
            position: relative;
        }

        .row {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            scroll-behavior: smooth;
            cursor: grab;
            user-select: none;


        }

        .row:active {
            cursor: grabbing;
        }

        .row::-webkit-scrollbar {
            display: none;
        }

        .card {
            min-width: 180px;
            background: var(--c2);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .card img {
            pointer-events: none;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 260px;
            background: rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: 0.3s;
        }

        .card:hover .overlay {
            opacity: 1;
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
        }

        .card-content {
            padding: 8px;
        }

        .title {
            font-size: 14px;
        }

        .card span {
            cursor: pointer;
            font-size: 18px;
            margin-right: 5px;
            transition: 0.2s;
        }

        .card span:hover {
            transform: scale(1.2);
        }

        .stars span {
            font-size: 20px;
            color: #888;
            cursor: pointer;
        }

        .stars span:hover,
        .stars span.active {
            color: gold;
            transform: scale(1.2);
        }

        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 28px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
        }

        .left {
            left: 0;
        }

        .rightArrow {
            right: 0;
        }

        footer {
            background: var(--c2);
            padding: 20px;
            text-align: center;
        }

        /* 📱 MOBİL */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
                padding: 10px;
            }

            .logo {
                text-align: center;
                font-size: 18px;
            }

            nav {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 15px;
            }

            nav a {
                font-size: 14px;
            }

            input {
                width: 100%;
                box-sizing: border-box;
            }

            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                justify-content: center;
            }

            nav a {
                margin: 0;
                font-size: 14px;
            }

            input {
                width: 100%;
            }

            .banner {
                height: 180px;
            }

            .section {
                padding: 15px 10px;
            }

            .row {
                gap: 10px;
            }

            .card {
                min-width: 130px;
            }

            .card img {
                height: 180px;
            }

            .overlay {
                height: 180px;
            }

            .title {
                font-size: 12px;
            }

            .stars span {
                font-size: 16px;
            }

            .arrow {
                display: none;
            }
        }
    </style>
</head>

        let favs = JSON.parse(localStorage.getItem("favs")) || [];
        let watched = JSON.parse(localStorage.getItem("watched")) || {};
        let ratings = JSON.parse(localStorage.getItem("ratings")) || {};

        function createCard(item) {
            let stars = "";
            for (let i = 0; i < 5; i++) {
                stars += `<span onclick="rate('${item.title}',${i})">★</span>`;
            }

            return `
<div class="card">
<img src="${item.img}">
<div class="overlay"></div>
<div class="card-content">
<div class="title">${item.title}</div>
<div>
<span onclick="toggleFav('${item.title}')">${favs.includes(item.title) ? "❤️" : "🤍"}</span>
<span onclick="toggleWatched('${item.title}')">${watched[item.title] ? "✔" : "☐"}</span>
</div>
<div class="stars">${stars}</div>
</div>
</div>`;
        }

        function render(list = data) {
            filmRow.innerHTML = "";
            diziRow.innerHTML = "";
            marvelRow.innerHTML = "";
            animeRow.innerHTML = "";
            favRow.innerHTML = "";
            watchedRow.innerHTML = "";

            list.forEach(item => {
                if (item.type === "film") filmRow.innerHTML += createCard(item);
                if (item.type === "dizi") diziRow.innerHTML += createCard(item);
                if (item.type === "marvel") marvelRow.innerHTML += createCard(item);
                if (item.type === "anime") animeRow.innerHTML += createCard(item);

                if (favs.includes(item.title)) favRow.innerHTML += createCard(item);
                if (watched[item.title]) watchedRow.innerHTML += createCard(item);
            });

            document.querySelectorAll(".card").forEach(card => {
                let title = card.querySelector(".title").innerText;
                let stars = card.querySelectorAll(".stars span");

                if (ratings[title] !== undefined) {
                    for (let i = 0; i <= ratings[title]; i++) {
                        stars[i].classList.add("active");
                    }
                }
            });
        }

        /* ⭐ DÜZELTİLEN KISIM */
        function rate(t, i) {
            if (ratings[t] === i) {
                delete ratings[t]; // tekrar basınca sıfırla
            } else {
                ratings[t] = i;
            }
            localStorage.setItem("ratings", JSON.stringify(ratings));
            render();
        }

        function toggleFav(t) {
            favs.includes(t) ? favs = favs.filter(x => x != t) : favs.push(t);
            localStorage.setItem("favs", JSON.stringify(favs));
            render();
        }

        function toggleWatched(t) {
            watched[t] = !watched[t];
            localStorage.setItem("watched", JSON.stringify(watched));
            render();
        }

        function search(v) {
            v = v.toLowerCase();
            render(data.filter(x => x.title.toLowerCase().includes(v)));
        }

        function scrollRow(id, a) {
            const el = document.getElementById(id);

            const maxScroll = el.scrollWidth - el.clientWidth;

            // sağ ok
            if (a > 0) {
                if (el.scrollLeft >= maxScroll - 10) {
                    el.scrollLeft = 0; // başa sar
                } else {
                    el.scrollLeft += a;
                }
            }

            // sol ok
            else {
                if (el.scrollLeft <= 10) {
                    el.scrollLeft = maxScroll; // sona git
                } else {
                    el.scrollLeft += a;
                }
            }
        }
        render();
        document.querySelectorAll(".row").forEach(row => {
            let isDown = false;
            let startX;
            let scrollLeft;

            row.addEventListener("mousedown", (e) => {
                isDown = true;
                startX = e.pageX;
                scrollLeft = row.scrollLeft;
                row.style.cursor = "grabbing";
            });

            row.addEventListener("mouseup", () => {
                isDown = false;
                row.style.cursor = "grab";
            });

            row.addEventListener("mouseleave", () => {
                isDown = false;
                row.style.cursor = "grab";
            });

            row.addEventListener("mousemove", (e) => {
                if (!isDown) return;
                e.preventDefault();

                const walk = (e.pageX - startX) * 1.5; // hız
                row.scrollLeft = scrollLeft - walk;
            });
        });
    </script>
